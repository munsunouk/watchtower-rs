  bifrost_oraclemanager_bnb_insufficient:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_bnb.yaml
  bifrost_oraclemanager_pol_insufficient:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_pol.yaml
  bifrost_oraclemanager_usdc_insufficient:
    <<: *common
