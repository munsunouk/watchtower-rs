version: '3.8'

services:
  watchtower:
    image: watchtower-worker
    volumes:
      - ./service:/app/service
      - ./worker/config.yaml:/app/worker/config.yaml
      - ./worker/param.yaml:/app/worker/param.yaml
      - ./lib/src/cli/abi:/app/lib/src/cli/abi
    environment:
      - RUST_LOG=info
    working_dir: /app
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "watch_tower_worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        # Kaia Chainlink
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_btc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_eth.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_usdc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_usdt.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_dai.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_xrp.yaml &

        # Bifrost Chainlink
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_btc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_eth.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_usdc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_usdt.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_dai.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_bnb.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_matic.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_euro.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_btcusd.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_wstbfc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_lp_btcusd.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_aggregator.yaml &

        # Base Chainlink
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/base_chainlink_btc.yaml &

        # BRP
        /usr/local/bin/watch_tower_worker --rule-path /app/service/brp/balance.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/brp/height.yaml &

        # Oracle Manager Decision
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/decision/bifrost_oraclemanager_bfc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/decision/bifrost_oraclemanager_bifi.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/decision/bifrost_oraclemanager_eth.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/decision/bifrost_oraclemanager_bnb.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/decision/bifrost_oraclemanager_pol.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/decision/bifrost_oraclemanager_usdc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/decision/bifrost_oraclemanager_usdt.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/decision/bifrost_oraclemanager_dai.yaml &

        # Oracle Manager Insufficient
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_bfc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_bifi.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_eth.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_bnb.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_pol.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_usdc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_usdt.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/insufficient/bifrost_oraclemanager_dai.yaml &

        # Oracle Majority
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/majority/bifrost_chainlink.yaml &

        # Oracle Price
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/price/bifrost_chainlink_bifnet_eth.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/price/bifrost_chainlink_bifnet_usdc.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/price/bifrost_chainlink_bifnet_usdt.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/price/bifrost_chainlink_bifnet_bnb.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/price/bifrost_chainlink_bifnet_matic.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/price/bifrost_chainlink_bifnet_dai.yaml &
        /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/price/bifrost_chainlink_bifnet_btc.yaml &

        # Keep container running and wait for all processes
        wait
      "
