version: '3.8'

x-common: &common
  image: watchtower-worker
  volumes:
    - ./service:/app/service
    - ./worker/config.yaml:/app/worker/config.yaml
    - ./worker/param.yaml:/app/worker/param.yaml
    - ./lib/src/cli/abi:/app/lib/src/cli/abi
  environment:
    - RUST_LOG=info
  working_dir: /app
  restart: on-failure:3
  restart_delay: 300
  healthcheck:
    test: ["CMD", "ps", "aux", "|", "grep", "watch_tower_worker"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 40s

services:
  # Kaia Chainlink Services
  kaia_btc_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_btc.yaml
  kaia_eth_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_eth.yaml
  kaia_usdc_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_usdc.yaml
  kaia_usdt_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_usdt.yaml
  kaia_dai_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_dai.yaml
  kaia_xrp_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/kaia_chainlink_xrp.yaml

  # Bifrost Chainlink Services
  bifrost_btc_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_btc.yaml
  bifrost_eth_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_eth.yaml
  bifrost_usdc_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_usdc.yaml
  bifrost_usdt_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_usdt.yaml
  bifrost_dai_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_dai.yaml
  bifrost_bnb_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_bnb.yaml
  bifrost_matic_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_matic.yaml
  bifrost_euro_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_euro.yaml
  bifrost_btcusd_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_btcusd.yaml
  bifrost_wstbfc_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_wstbfc.yaml
  bifrost_lp_btcusd_worker:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/balance/bifrost_chainlink_lp_btcusd.yaml
  bifrost_aggregator_worker:
    <<: *common
