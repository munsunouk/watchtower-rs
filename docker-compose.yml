  bifrost_chainlink_bifnet_dai_price:
    <<: *common
    command: /usr/local/bin/watch_tower_worker --rule-path /app/service/oracle/price/bifrost_chainlink_bifnet_dai.yaml
  bifrost_chainlink_bifnet_btc_price:
    <<: *common
