name: Bifrost Basic Node 01 Node Status Check
time_interval: 600
script: |
  active_status = 1;
  node_name = 'bifrost-basic-node-01';

  bifrostBN = Bifrost.LatestBlock();
  node_status = Bifrost.Validator.Candidate.Status(bifrostBN, node_name);
  statue_name = when node_status == 2 then 'kicked out' else 'idle';
  when node_status != active_status then Slack.Send(CCCP, '*Node Liveness 알람* 🚀\n> Node : ' + node_name + '\n> 상태 :' + statue_name) else false;
