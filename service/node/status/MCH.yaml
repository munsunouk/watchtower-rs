name: MCH Node Status Check
time_interval: 600
script: |
  notify_time_interval = 60 * 60 * 3;
  node_name = 'MCH';

  bifrostBN = Bifrost.LatestBlock();
  node_status = Bifrost.Validator.Candidate.Status(bifrostBN, node_name);
  status_name = if node_status == 1 (
    'active';
  ) else if node_status == 2 (
    'kicked out';
  ) else if node_status == 0 (
    'idle';
  ) else (
    'leaving';
  );

  msg = '*Node Liveness 알람* 🚀\n> Node : ' + node_name + '\n> 상태 :' + status_name;

  if node_status != 1 (
    Slack.Send(CCCP, notify_time_interval, msg)
  );
