name: Chainlink Oracle DAI Address Check
time_interval: 600
script: |
  symbol = 'DAI';
  notify_address = '0xAed0c38402a5d19df6E4c03F4E2DceD6e29c1ee9';
  notify_time_interval = 60 * 60 * 3;

  current_address = ChainlinkOracle.Address(Chainlink, symbol);

  msg = '*Chainlink Oracle DAI Address 알람* 🚀\n <!here>\n> 기존 address : ' + notify_address + '\n> 변경된 address : ' + current_address;

  if current_address != notify_address (
      Slack.Send(Monitor, notify_time_interval, msg);
  );
