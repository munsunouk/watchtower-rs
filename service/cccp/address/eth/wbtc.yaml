name: Chainlink Oracle wBTC Address Check
time_interval: 600
script: |
  chain = 'ETH';
  symbol = 'wBTC';
  notify_address = '0xa5e3a55cea42b86560a5215094981c300899199d';
  notify_time_interval = 60 * 60 * 3;

  ETHBN = ETH.LatestBlock();
  current_address = ETH.ChainlinkOracle.wBTC.Address(ETHBN);

  msg = '*Chainlink Oracle wBTC Address 알람* 🚀\n <!here>\n> 체인 : ' + chain + '\n> 기존 address : ' + notify_address + '\n> 변경된 address : ' + current_address;

  if current_address != notify_address (
      Slack.Send(Monitor, notify_time_interval, msg);
  );
