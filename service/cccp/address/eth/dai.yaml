name: ETH Chain Chainlink Oracle DAI Address Check
time_interval: 600
script: |
  chain = 'ETH';
  symbol = 'DAI';
  notify_address = '0x709783ab12b65fd6cd948214eee6448f3bdd72a3';
  notify_time_interval = 60 * 60 * 3;

  ETHBN = ETH.LatestBlock();
  current_address = ETH.ChainlinkOracle.DAI.Address(ETHBN);

  msg = '*Chainlink Oracle DAI Address 알람* 🚀\n <!here>\n> 체인 : ' + chain + '\n> 기존 address : ' + notify_address + '\n> 변경된 address : ' + current_address;

  if current_address != notify_address (
      Slack.Send(Monitor, notify_time_interval, msg);
  );
