name: ETH Chain Chainlink Oracle cbBTC Address Check
time_interval: 600
script: |
  chain = 'ETH';
  symbol = 'cbBTC';
  notify_address = '0x5e2420cace3650622f62b2713b2b3727fc8bcdd1';
  notify_time_interval = 60 * 60 * 3;

  ETHBN = ETH.LatestBlock();
  current_address = ETH.ChainlinkOracle.cbBTC.Address(ETHBN);

  msg = '*Chainlink Oracle cbBTC Address 알람* 🚀\n <!here>\n> 체인 : ' + chain + '\n> 기존 address : ' + notify_address + '\n> 변경된 address : ' + current_address;

  if current_address != notify_address (
      Slack.Send(Monitor, notify_time_interval, msg);
  );
