name: ETH Chain Chainlink Oracle BTC Address Check
time_interval: 600
script: |
  chain = 'ETH';
  symbol = 'BTC';
  notify_address = '0x4a3411ac2948b33c69666b35cc6d055b27ea84f1';
  notify_time_interval = 60 * 60 * 3;

  ETHBN = ETH.LatestBlock();
  current_address = ETH.ChainlinkOracle.BTC.Address(ETHBN);

  msg = '*Chainlink Oracle BTC Address 알람* 🚀\n <!here>\n> 체인 : ' + chain + '\n> 기존 address : ' + notify_address + '\n> 변경된 address : ' + current_address;

  if current_address != notify_address (
      Slack.Send(Monitor, notify_time_interval, msg);
  );
