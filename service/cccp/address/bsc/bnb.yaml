name: Chainlink Oracle BNB Address Check
time_interval: 600
script: |
  chain = 'BSC';
  symbol = 'BNB';
  notify_address = '0xa6e8fee84f9bd528ad71917c9ddbb1fd3214f280';
  notify_time_interval = 60 * 60 * 3;

  BNBBN = BNB.LatestBlock();
  current_address = BNB.ChainlinkOracle.BNB.Address(BNBBN);

  msg = '*Chainlink Oracle BNB Address 알람* 🚀\n <!here>\n> 체인 : ' + chain + '\n> 기존 address : ' + notify_address + '\n> 변경된 address : ' + current_address;

  if current_address != notify_address (
      Slack.Send(Monitor, notify_time_interval, msg);
  );
