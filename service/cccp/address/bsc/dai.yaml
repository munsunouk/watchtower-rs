name: Chainlink Oracle XRP Address Check
time_interval: 600
script: |
  chain = 'BSC';
  symbol = 'XRP';
  notify_address = '0x923f7ae6bc5fa488d82cfd9130ece95cf6c975f4';
  notify_time_interval = 60 * 60 * 3;

  BNBBN = BNB.LatestBlock();
  current_address = BNB.ChainlinkOracle.XRP.Address(BNBBN);

  msg = '*Chainlink Oracle XRP Address 알람* 🚀\n <!here>\n> 체인 : ' + chain + '\n> 기존 address : ' + notify_address + '\n> 변경된 address : ' + current_address;

  if current_address != notify_address (
      Slack.Send(Monitor, notify_time_interval, msg);
  );
