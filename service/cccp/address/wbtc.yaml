name: Chainlink Oracle wBTC Address Check
time_interval: 600
script: |
  symbol = 'wBTC';
  notify_address = '0xfdFD9C85aD200c506Cf9e21F1FD8dd01932FBB23';
  notify_time_interval = 60 * 60 * 3;

  current_address = ChainlinkOracle.Address(Chainlink, symbol);

  msg = '*Chainlink Oracle wBTC Address 알람* 🚀\n <!here>\n> 기존 address : ' + notify_address + '\n> 변경된 address : ' + current_address;

  if current_address != notify_address (
      Slack.Send(Monitor, notify_time_interval, msg);
  );
