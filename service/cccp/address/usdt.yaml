name: Chainlink Oracle USDT Address Check
time_interval: 600
script: |
  symbol = 'USDT';
  notify_address = '0x3E7d1eAB13ad0104d2750B8863b489D65364e32D';
  notify_time_interval = 60 * 60 * 3;

  current_address = ChainlinkOracle.Address(Chainlink, symbol);

  msg = '*Chainlink Oracle USDT Address 알람* 🚀\n <!here>\n> 기존 address : ' + notify_address + '\n> 변경된 address : ' + current_address;

  if current_address != notify_address (
      Slack.Send(Monitor, notify_time_interval, msg);
  );
