name: Oasys Round Sync Check
time_interval: 600
script: |
  active_status = 1;

  bifrostBN = Bifrost.LatestBlock();
  bifrost_round_status = Bifrost.CCCP.LatestRound.Status(bifrostBN);

  oasysBN = Oasys.LatestBlock();
  oasys_round_status = Oasys.CCCP.LatestRound.Status(oasysBN);
  sync_diff = when bifrost_round_status > oasys_round_status then bifrost_round_status - oasys_round_status else oasys_round_status - bifrost_round_status;

  when bifrost_round_status != oasys_round_status then Slack.Send(CCCP, '*CCCP Round Sync 알람* 🚀\n <!here>\n> Sync 차이 : ' + sync_diff + '\n> Bifrost : ' + bifrost_round_status + '\n> Oasys : ' + oasys_round_status) else false;
