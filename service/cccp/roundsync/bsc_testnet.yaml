name: BSC Testnet Round Sync Check
time_interval: 600
script: |
  active_status = 1;

  bifrostBN = Bifrost_Testnet.LatestBlock();
  bifrost_round_status = Bifrost_Testnet.CCCP.LatestRound.Status(bifrostBN);

  bscBN = BNB_Testnet.LatestBlock();
  bsc_round_status = BNB_Testnet.CCCP.LatestRound.Status(bscBN);
  sync_diff = when bifrost_round_status > bsc_round_status then bifrost_round_status - bsc_round_status else bsc_round_status - bifrost_round_status;

  when bifrost_round_status != bsc_round_status then Slack.Send(CCCP, '*CCCP Round Sync 알람* 🚀\n <!here>\n> Sync 차이 : ' + sync_diff + '\n> Bifrost Testnet: ' + bifrost_round_status + '\n> BSC Testnet : ' + bsc_round_status) else false;
