name: Arbitrum Sepolia Round Sync Check
time_interval: 600
script: |
  active_status = 2;

  bifrostBN = Bifrost_Testnet.LatestBlock();
  bifrost_round_status = Bifrost_Testnet.CCCP.LatestRound.Status(bifrostBN);

  arbitrumBN = Arbitrum_Sepolia.LatestBlock();
  arbitrum_round_status = Arbitrum_Sepolia.CCCP.LatestRound.Status(arbitrumBN);
  sync_diff = when bifrost_round_status > arbitrum_round_status then bifrost_round_status - arbitrum_round_status else arbitrum_round_status - bifrost_round_status;

  when sync_diff > active_status then Slack.Send(CCCP, '*CCCP Round Sync 알람* 🚀\n <!here>\n> Sync 차이 : ' + sync_diff + '\n> Bifrost Testnet: ' + bifrost_round_status + '\n> Arbitrum Sepolia : ' + arbitrum_round_status) else false;
