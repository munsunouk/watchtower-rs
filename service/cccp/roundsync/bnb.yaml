name: BNB Round Sync Check
time_interval: 600
script: |
  active_status = 1;

  bifrostBN = Bifrost.LatestBlock();
  bifrost_round_status = Bifrost.CCCP.LatestRound.Status(bifrostBN);

  bnbBN = BNB.LatestBlock();
  bnb_round_status = BNB.CCCP.LatestRound.Status(bnbBN);
  sync_diff = when bifrost_round_status > bnb_round_status then bifrost_round_status - bnb_round_status else bnb_round_status - bifrost_round_status;

  when bifrost_round_status != bnb_round_status then Slack.Send(CCCP, '*CCCP Round Sync 알람* 🚀\n <!here>\n> Sync 차이 : ' + sync_diff + '\n> Bifrost : ' + bifrost_round_status + '\n> BNB : ' + bnb_round_status) else false;
