name: BSC Testnet Round Sync Check
time_interval: 600
script: |
  active_status = 2;
  notify_time_interval = 60 * 60 * 3;

  bifrostBN = Bifrost_Testnet.LatestBlock();
  bifrost_round_status = Bifrost_Testnet.CCCP.LatestRound.Status(bifrostBN);

  bnbBN = BNB_Testnet.LatestBlock();
  bnb_round_status = BNB_Testnet.CCCP.LatestRound.Status(bnbBN);
  sync_diff = when bifrost_round_status > bnb_round_status then bifrost_round_status - bnb_round_status else bnb_round_status - bifrost_round_status;

  msg = '*CCCP Round Sync 알람* 🚀\n <!here>\n> Sync 차이 : ' + sync_diff + '\n> Bifrost Testnet: ' + bifrost_round_status + '\n> BNB Testnet : ' + bsc_round_status;

  if sync_diff > active_status (
    Slack.Send(CCCP, notify_time_interval, msg)
  );
