name: Base Sepolia Round Sync Check
time_interval: 600
script: |
  active_status = 2;

  bifrostBN = Bifrost_Testnet.LatestBlock();
  bifrost_round_status = Bifrost_Testnet.CCCP.LatestRound.Status(bifrostBN);

  baseBN = Base_Sepolia.LatestBlock();
  base_round_status = Base_Sepolia.CCCP.LatestRound.Status(baseBN);
  sync_diff = when bifrost_round_status > base_round_status then bifrost_round_status - base_round_status else base_round_status - bifrost_round_status;

  when bifrost_round_status != base_round_status then Slack.Send(CCCP, '*CCCP Round Sync 알람* 🚀\n <!here>\n> Sync 차이 : ' + sync_diff + '\n> Bifrost Testnet: ' + bifrost_round_status + '\n> Base Sepolia : ' + base_round_status) else false;
