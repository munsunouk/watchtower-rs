name: CCCP Height Check
time_interval: 600
script: |
  number_diff = 100;
  public_height = BNB.LatestBlock();
  atn_height = BNB_PUB.LatestBlock();
  height_diff = when public_height > atn_height then public_height - atn_height else 0;
  when height_diff > number_diff then Slack.Send(CORE, '*CCCP BSC Block 알람* 🚀\n <!here>\n> 블록 차이: ' + height_diff + '\n> 퍼블릭노드 : ' + public_height + '\n> ATN노드 : ' + atn_height) else false;
