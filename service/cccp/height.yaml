name: CCCP Height Check
time_interval: 600
script: |
  number_diff = 100;
  public_height = BNB.LatestBlock();
  atn_height = BNB_PUB.LatestBlock();
  height_diff = public_height - atn_height;

  msg = '*CCCP BSC Block 알람* 🚀\n <!here>\n> 블록 차이: ' + height_diff + '\n> 퍼블릭노드(bsc-rpc.publicnode.com) : ' + public_height + '\n> ATN노드 : ' + atn_height;

  if height_diff > number_diff (
    Slack.Send(CCCP, notify_time_interval, msg);
  );
