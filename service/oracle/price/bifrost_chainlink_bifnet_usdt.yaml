name: Bifrost Chainlink-Bifnet USDT Price Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();

  bifrostChainlinkUSDT = Bifrost.ChainlinkOracle.USDT.LatestPrice(bifrostBN);
  bifrostBifnetUSDT = Bifrost.BifnetOracle.USDT.LatestPrice(bifrostBN);

  diff = (bifrostChainlinkUSDT - bifrostBifnetUSDT) / bifrostChainlinkUSDT * 100;

  msg = '*Bifrost Chainlink-Bifnet USDT Price Check 알람* 🚀\n> 차이 : ' + diff;

  if diff > 5 || diff < -5 (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
