name: Bifrost Chainlink-Bifnet USDC Price Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  notify_time_interval = 60 * 60 * 3;

  bifrostChainlinkUSDC = Bifrost.ChainlinkOracle.USDC.LatestPrice(bifrostBN);
  bifrostBifnetUSDC = Bifrost.BifnetOracle.USDC.LatestPrice(bifrostBN);

  diff = (bifrostChainlinkUSDC - bifrostBifnetUSDC) / bifrostChainlinkUSDC * 100;

  msg = '*Bifrost Chainlink-Bifnet USDC Price Check 알람* 🚀\n> 차이 : ' + diff;

  if diff > 5 || diff < -5 (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
