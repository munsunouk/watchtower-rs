name: Bifrost Chainlink-Bifnet ETH Price Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  notify_time_interval = 60 * 60 * 3;

  bifrostChainlinkETH = Bifrost.ChainlinkOracle.ETH.LatestPrice(bifrostBN);
  bifrostBifnetETH = Bifrost.BifnetOracle.ETH.LatestPrice(bifrostBN);

  diff = (bifrostChainlinkETH - bifrostBifnetETH) / bifrostChainlinkETH * 100;

  msg = '*Bifrost Chainlink-Bifnet ETH Price Check 알람* 🚀\n> 차이 : ' + diff;

  if diff > 5 || diff < -5 (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
