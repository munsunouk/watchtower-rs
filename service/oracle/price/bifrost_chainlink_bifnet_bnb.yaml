name: Bifrost Chainlink-Bifnet BNB Price Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();

  bifrostChainlinkBNB = Bifrost.ChainlinkOracle.BNB.LatestPrice(bifrostBN);
  bifrostBifnetBNB = Bifrost.BifnetOracle.BNB.LatestPrice(bifrostBN);

  diff = (bifrostChainlinkBNB - bifrostBifnetBNB) / bifrostChainlinkBNB * 100;

  msg = '*Bifrost Chainlink-Bifnet BNB Price Check 알람* 🚀\n> 차이 : ' + diff;

  if diff > 5 || diff < -5 (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
