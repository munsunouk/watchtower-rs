name: Bifrost OracleManager POL Insufficient Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  feeder = Bifrost.CCCP.Feeder.Relayer(bifrostBN);
  decisionInterval = Bifrost.OracleManager.TimeFilter.Decision(bifrostBN, POL);
  lastDecision = Bifrost.OracleManager.Info.LastTimestamp(bifrostBN, POL);

  secPastSinceLastDecision = currentTimestamp - lastDecision;

  msg = '*Bifrost OracleManager POL Insufficient 알람* 🚀\n> 마지막 업데이트 시간 : ' + lastDecision + '\n> 현재 시간 : ' + currentTimestamp + '\n> 결정 간격 : ' + decisionInterval;

  if secPastSinceLastDecision < decisionInterval - 300 (
    msg;
  );
