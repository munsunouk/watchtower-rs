name: Bifrost OracleManager BIFI Insufficient Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  feeder = Bifrost.Internal.Feeder.Relayer(bifrostBN);
  decisionInterval = Bifrost.OracleManager.TimeFilter.Decision(bifrostBN, BIFI);
  lastDecision = Bifrost.OracleManager.Info.LastTimestamp(bifrostBN, BIFI);

  secPastSinceLastDecision = currentTimestamp - lastDecision;
  secPastSinceLastDecision < decisionInterval - 300;
