name: Bifrost OracleManager BNB Insufficient Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  feeder = Bifrost.CCCP.Feeder.Relayer(bifrostBN);
  decisionInterval = Bifrost.OracleManager.TimeFilter.Decision(bifrostBN, BNB);
  lastDecision = Bifrost.OracleManager.Info.LastTimestamp(bifrostBN, BNB);

  secPastSinceLastDecision = currentTimestamp - lastDecision;

  msg = '*Bifrost OracleManager BNB Insufficient 알람* 🚀\n> 마지막 업데이트 시간 : ' + lastDecision + '\n> 현재 시간 : ' + currentTimestamp + '\n> 결정 간격 : ' + decisionInterval;

  if secPastSinceLastDecision < decisionInterval - 300 (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
