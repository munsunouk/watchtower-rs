name: Bifrost OracleManager BFC Insufficient Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  feeder = Bifrost.CCCP.Feeder.Relayer(bifrostBN);
  decisionInterval = Bifrost.OracleManager.TimeFilter.Decision(bifrostBN, BFC);
  lastDecision = Bifrost.OracleManager.Info.LastTimestamp(bifrostBN, BFC);

  secPastSinceLastDecision = currentTimestamp - lastDecision;
  secPastSinceLastDecision < decisionInterval - 300;
