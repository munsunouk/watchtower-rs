name: Bifrost OracleManager POL Decision Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  round = Bifrost.OracleManager.Round.Round(bifrostBN, POL);
  lastTimestamp = Bifrost.OracleManager.History.Timestamp(bifrostBN, POL, round);
  decisionInterval = Bifrost.OracleManager.TimeFilter.Decision(bifrostBN, POL);

  nextUpdateAt = lastTimestamp + decisionInterval;

  msg = '*Bifrost OracleManager POL Decision 알람* 🚀\n> 다음 업데이트 시간 : ' + nextUpdateAt + '\n> 현재 시간 : ' + currentTimestamp;

  if nextUpdateAt + 300 < currentTimestamp (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
