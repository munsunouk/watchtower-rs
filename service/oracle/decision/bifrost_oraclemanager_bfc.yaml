name: Bifrost OracleManager BFC Decision Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  round = Bifrost.OracleManager.Round.Round(bifrostBN, BFC);
  lastTimestamp = Bifrost.OracleManager.History.Timestamp(bifrostBN, BFC, round);
  decisionInterval = Bifrost.OracleManager.TimeFilter.Decision(bifrostBN, BFC);

  nextUpdateAt = lastTimestamp + decisionInterval;

  nextUpdateAt + 300 < currentTimestamp;
