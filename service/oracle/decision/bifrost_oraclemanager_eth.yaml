name: Bifrost OracleManager ETH Decision Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  round = Bifrost.OracleManager.Round.Round(bifrostBN, ETH);
  lastTimestamp = Bifrost.OracleManager.History.Timestamp(bifrostBN, ETH, round);
  decisionInterval = Bifrost.OracleManager.TimeFilter.Decision(bifrostBN, ETH);

  nextUpdateAt = lastTimestamp + decisionInterval;

  msg = '*Bifrost OracleManager ETH Decision 알람* 🚀\n> 다음 업데이트 시간 : ' + nextUpdateAt + '\n> 현재 시간 : ' + currentTimestamp;

  if nextUpdateAt + 300 < currentTimestamp (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
