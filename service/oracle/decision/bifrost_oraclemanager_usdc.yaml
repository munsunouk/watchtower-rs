name: Bifrost OracleManager USDC Decision Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  round = Bifrost.OracleManager.Round.Round(bifrostBN, USDC);
  lastTimestamp = Bifrost.OracleManager.History.Timestamp(bifrostBN, USDC, round);
  decisionInterval = Bifrost.OracleManager.TimeFilter.Decision(bifrostBN, USDC);

  nextUpdateAt = lastTimestamp + decisionInterval;

  nextUpdateAt + 300 < currentTimestamp;
