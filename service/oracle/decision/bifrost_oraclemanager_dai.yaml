name: Bifrost OracleManager DAI Decision Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  round = Bifrost.OracleManager.Round.Round(bifrostBN, DAI);
  lastTimestamp = Bifrost.OracleManager.History.Timestamp(bifrostBN, DAI, round);
  decisionInterval = Bifrost.OracleManager.TimeFilter.Decision(bifrostBN, DAI);

  nextUpdateAt = lastTimestamp + decisionInterval;

  msg = '*Bifrost OracleManager DAI Decision 알람* 🚀\n> 다음 업데이트 시간 : ' + nextUpdateAt + '\n> 현재 시간 : ' + currentTimestamp;

  if nextUpdateAt + 300 < currentTimestamp (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
