name: Kaia Chainlink USDC Time Check
time_interval: 300
script: |
  kaiaBN = Kaia.LatestBlock();
  currentTimestamp = Kaia.LatestTimestamp();

  kaiaChainlinkUSDC = Kaia.ChainlinkOracle.USDC.LatestTimestamp(kaiaBN);

  diff = currentTimestamp - kaiaChainlinkUSDC;

  msg = '*Kaia Chainlink USDC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + kaiaChainlinkUSDC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
