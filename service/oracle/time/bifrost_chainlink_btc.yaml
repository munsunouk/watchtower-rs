name: Bifrost Chainlink BTC Time Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostChainlinkBTC = Bifrost.ChainlinkOracle.BTC.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostChainlinkBTC;

  msg = '*Bifrost Chainlink BTC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + bifrostChainlinkBTC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
