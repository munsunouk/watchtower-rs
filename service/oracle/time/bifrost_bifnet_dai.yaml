name: Bifrost Bifnet DAI Time Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostBifnetDAI = Bifrost.BifnetOracle.DAI.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostBifnetDAI;

  msg = '*Bifrost Bifnet DAI Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 비프넷 시간 : ' + bifrostBifnetDAI;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
