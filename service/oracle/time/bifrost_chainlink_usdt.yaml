name: Bifrost Chainlink USDT Time Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostChainlinkUSDT = Bifrost.ChainlinkOracle.USDT.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostChainlinkUSDT;

  msg = '*Bifrost Chainlink USDT Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + bifrostChainlinkUSDT;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
