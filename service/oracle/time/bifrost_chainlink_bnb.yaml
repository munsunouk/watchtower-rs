name: Bifrost Chainlink BNB Time Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostChainlinkBNB = Bifrost.ChainlinkOracle.BNB.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostChainlinkBNB;

  msg = '*Bifrost Chainlink BNB Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + bifrostChainlinkBNB;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
