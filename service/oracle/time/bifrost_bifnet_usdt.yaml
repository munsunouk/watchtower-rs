name: Bifrost Bifnet USDT Time Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostBifnetUSDT = Bifrost.BifnetOracle.USDT.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostBifnetUSDT;

  msg = '*Bifrost Bifnet USDT Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 비프넷 시간 : ' + bifrostBifnetUSDT;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
