name: Bifrost Aggregator BTCB Time Check
time_interval: 300
script: |


  notify_time_interval = 60 * 60 * 3;

  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostAggregatorBTCB = Bifrost.AggregatorOracle.BTCB.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostAggregatorBTCB;

  msg = '*Bifrost Aggregator BTCB Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 어그리게이터 시간 : ' + bifrostAggregatorBTCB;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
