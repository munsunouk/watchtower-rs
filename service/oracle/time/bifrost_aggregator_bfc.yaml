name: Bifrost Aggregator BFC Time Check
time_interval: 300
script: |

  notify_time_interval = 60 * 60 * 3;

  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostAggregatorBFC = Bifrost.AggregatorOracle.BFC.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostAggregatorBFC;

  msg = '*Bifrost Aggregator BFC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 어그리게이터 시간 : ' + bifrostAggregatorBFC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
