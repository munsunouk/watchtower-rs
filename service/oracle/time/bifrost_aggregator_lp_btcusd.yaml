name: Bifrost Aggregator LP(BTCUSD/USDC) Time Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostAggregatorLPBTCUSDUSDC = Bifrost.AggregatorOracle.LP_BTCUSD_USDC.LatestTimestamp(bifrostBN);

  msg = '*Bifrost Aggregator LP(BtcUSD/USDC) Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 어그리게이터 시간 : ' + bifrostAggregatorLPBTCUSDUSDC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
