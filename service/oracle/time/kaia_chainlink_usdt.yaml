name: Kaia Chainlink USDT Time Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;
  kaiaBN = Kaia.LatestBlock();
  currentTimestamp = Kaia.LatestTimestamp();

  kaiaChainlinkUSDT = Kaia.ChainlinkOracle.USDT.LatestTimestamp(kaiaBN);

  diff = currentTimestamp - kaiaChainlinkUSDT;

  msg = '*Kaia Chainlink USDT Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + kaiaChainlinkUSDT;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
