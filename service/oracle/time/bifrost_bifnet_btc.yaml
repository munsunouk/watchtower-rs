name: Bifrost Bifnet BTC Time Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostBifnetBTC = Bifrost.BifnetOracle.BTC.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostBifnetBTC;

  msg = '*Bifrost Bifnet BTC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 비프넷 시간 : ' + bifrostBifnetBTC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
