name: Bifrost Bifnet BFC Time Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostBifnetBFC = Bifrost.BifnetOracle.BFC.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostBifnetBFC;

  msg = '*Bifrost Bifnet BFC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 비프넷 시간 : ' + bifrostBifnetBFC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
