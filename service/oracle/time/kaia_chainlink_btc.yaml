name: Kaia Chainlink BTC Time Check
time_interval: 300
script: |
  kaiaBN = Kaia.LatestBlock();
  currentTimestamp = Kaia.LatestTimestamp();

  kaiaChainlinkBTC = Kaia.ChainlinkOracle.BTC.LatestTimestamp(kaiaBN);

  diff = currentTimestamp - kaiaChainlinkBTC;

  msg = '*Kaia Chainlink BTC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + kaiaChainlinkBTC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
