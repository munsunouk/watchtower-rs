name: Bifrost Chainlink EURO Time Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostChainlinkEURO = Bifrost.ChainlinkOracle.EURO.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostChainlinkEURO;

  msg = '*Bifrost Chainlink EURO Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + bifrostChainlinkEURO;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
