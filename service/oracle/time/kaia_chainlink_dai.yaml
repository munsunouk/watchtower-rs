name: Kaia Chainlink DAI Time Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;
  kaiaBN = Kaia.LatestBlock();
  currentTimestamp = Kaia.LatestTimestamp();

  kaiaChainlinkDAI = Kaia.ChainlinkOracle.DAI.LatestTimestamp(kaiaBN);

  diff = currentTimestamp - kaiaChainlinkDAI;

  msg = '*Kaia Chainlink DAI Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + kaiaChainlinkDAI;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
