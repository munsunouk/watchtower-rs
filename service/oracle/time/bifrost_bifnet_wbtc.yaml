name: Bifrost Bifnet wBTC Time Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostBifnetwBTC = Bifrost.BifnetOracle.wBTC.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostBifnetwBTC;

  msg = '*Bifrost Bifnet wBTC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 비프넷 시간 : ' + bifrostBifnetwBTC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
