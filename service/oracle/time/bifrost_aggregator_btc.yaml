name: Bifrost Aggregator BTC Time Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostAggregatorBTC = Bifrost.AggregatorOracle.BTC.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostAggregatorBTC;

  msg = '*Bifrost Aggregator BTC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 어그리게이터 시간 : ' + bifrostAggregatorBTC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
