name: Bifrost Aggregator BIFI Time Check
time_interval: 300
script: |

  notify_time_interval = 60 * 60 * 3;

  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostAggregatorBIFI = Bifrost.AggregatorOracle.BIFI.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostAggregatorBIFI;

  msg = '*Bifrost Aggregator BIFI Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 어그리게이터 시간 : ' + bifrostAggregatorBIFI;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
