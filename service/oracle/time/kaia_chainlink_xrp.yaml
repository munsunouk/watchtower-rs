name: Kaia Chainlink XRP Time Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;
  kaiaBN = Kaia.LatestBlock();
  currentTimestamp = Kaia.LatestTimestamp();

  kaiaChainlinkXRP = Kaia.ChainlinkOracle.XRP.LatestTimestamp(kaiaBN);

  diff = currentTimestamp - kaiaChainlinkXRP;

  msg = '*Kaia Chainlink XRP Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + kaiaChainlinkXRP;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
