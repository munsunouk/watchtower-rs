name: Bifrost Aggregator BTCUSD Time Check
time_interval: 300
script: |

  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostAggregatorBTCUSD = Bifrost.AggregatorOracle.BTCUSD.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostAggregatorBTCUSD;

  msg = '*Bifrost Aggregator BTCUSD Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 어그리게이터 시간 : ' + bifrostAggregatorBTCUSD;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
