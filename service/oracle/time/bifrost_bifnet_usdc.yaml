name: Bifrost Bifnet USDC Time Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();
  currentTimestamp = Bifrost.LatestTimestamp();

  bifrostBifnetUSDC = Bifrost.BifnetOracle.USDC.LatestTimestamp(bifrostBN);

  diff = currentTimestamp - bifrostBifnetUSDC;

  msg = '*Bifrost Bifnet USDC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 비프넷 시간 : ' + bifrostBifnetUSDC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
