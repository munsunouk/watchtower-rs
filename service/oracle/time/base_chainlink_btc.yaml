name: Base Chainlink BTC Time Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;

  baseBN = Base.LatestBlock();
  currentTimestamp = Base.LatestTimestamp();

  baseChainlinkBTC = Base.ChainlinkOracle.BTC.LatestTimestamp(baseBN);

  diff = currentTimestamp - baseChainlinkBTC;

  msg = '*Base Chainlink BTC Time Check 알람* 🚀\n> 차이 : ' + diff + '\n> 현재 시간 : ' + currentTimestamp + '\n> 체인링크 시간 : ' + baseChainlinkBTC;

  if diff > (3600 * 72) (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
