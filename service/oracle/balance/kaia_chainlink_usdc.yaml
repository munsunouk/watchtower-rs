name: Kaia Chainlink USDC Balance Check
time_interval: 300
script: |
  decimal = 10 ** 18;
  notify_time_interval = 60 * 60 * 3;
  kaiaBN = Kaia.LatestBlock();

  BalanceUSDC = Kaia.Balance(kaiaBN, USDC) / decimal;

  CompareBalance = 10;

  msg = '*Kaia Chainlink USDC Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceUSDC + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceUSDC (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
