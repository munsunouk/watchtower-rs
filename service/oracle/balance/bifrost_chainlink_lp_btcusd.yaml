name: Bifrost Chainlink LP BTCUSD Balance Check
time_interval: 300
script: |
  decimal = 10 ** 18;
  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();

  BalanceLP = Bifrost.Balance(bifrostBN, Lp_BtcUSD) / decimal;

  CompareBalance = 10;

  msg = '*Bifrost Chainlink LP BtcUSD Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceLP + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceLP (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
