name: Bifrost Chainlink LP BTCUSD Balance Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();

  BalanceLPBTCUSD = Bifrost.Balance(bifrostBN, Lp_BtcUSD);

  CompareBalance = 10000000000000000000;

  msg = '*Bifrost Chainlink LP BTCUSD Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceLPBTCUSD + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceLPBTCUSD (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
