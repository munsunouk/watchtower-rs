name: Kaia Chainlink USDT Balance Check
time_interval: 300
script: |
  decimal = 10 ** 18;
  notify_time_interval = 60 * 60 * 3;
  kaiaBN = Kaia.LatestBlock();

  BalanceUSDT = Kaia.Balance(kaiaBN, USDT) / decimal;

  CompareBalance = 10;

  msg = '*Kaia Chainlink USDT Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceUSDT + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceUSDT (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
