name: Bifrost Chainlink BTCUSD Balance Check
time_interval: 300
script: |
  decimal = 10 ** 18;
  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();

  BalanceBTCUSD = Bifrost.Balance(bifrostBN, BtcUSD) / decimal;

  CompareBalance = 10;

  msg = '*Bifrost Chainlink BtcUSD Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceBTCUSD + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceBTCUSD (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
