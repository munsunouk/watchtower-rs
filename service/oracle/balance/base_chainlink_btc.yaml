name: Base Chainlink BTC Balance Check
time_interval: 300
script: |
  baseBN = Base.LatestBlock();

  BalanceBTC = Base.Balance(baseBN, BTC);

  CompareBalance = 10000000000000000;

  CompareBalance > BalanceBTC;
  when CompareBalance > BalanceBTC then Slack.Send(TEST, '*Node Liveness 알람* 🚀\n> Node : ' + node_name + '\n> 상태 :' + statue_name) else false;
