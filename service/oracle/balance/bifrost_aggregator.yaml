name: Bifrost Aggregator Balance Check
time_interval: 300
script: |
  decimal = 10 ** 18;
  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();

  BalanceAGG = Bifrost.Balance(bifrostBN, Aggregator) / decimal;

  CompareBalance = 10;

  msg = '*Bifrost Aggregator Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceAGG + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceAGG (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
