name: Bifrost Chainlink wstBFC Balance Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();

  BalanceWSTBFC = Bifrost.Balance(bifrostBN, wstBFC);

  CompareBalance = 10000000000000000000;

  msg = '*Bifrost Chainlink wstBFC Balance 알람* 🚀\n> 현재 잔액 : ' + Balance wstBFC + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceWSTBFC (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
