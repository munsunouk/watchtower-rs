name: Bifrost Chainlink EURO Balance Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();

  BalanceEURO = Bifrost.Balance(bifrostBN, EURO);

  CompareBalance = 10000000000000000000;

  msg = '*Bifrost Chainlink EURO Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceEURO + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceEURO (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
