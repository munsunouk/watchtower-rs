name: Bifrost Chainlink POL Balance Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();

  BalancePOL = Bifrost.Balance(bifrostBN, POL);

  CompareBalance = 10000000000000000000;

  msg = '*Bifrost Chainlink POL Balance 알람* 🚀\n> 현재 잔액 : ' + BalancePOL + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalancePOL (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
