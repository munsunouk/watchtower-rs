name: Bifrost Chainlink BNB Balance Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();

  BalanceBNB = Bifrost.Balance(bifrostBN, BNB);

  CompareBalance = 10000000000000000000;

  msg = '*Bifrost Chainlink BNB Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceBNB + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceBNB (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
