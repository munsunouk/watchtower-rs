name: Kaia Chainlink XRP Balance Check
time_interval: 300
script: |
  kaiaBN = Kaia.LatestBlock();

  BalanceXRP = Kaia.Balance(kaiaBN, XRP);

  CompareBalance = 10000000000000000000;

  msg = '*Kaia Chainlink XRP Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceXRP + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceXRP (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
