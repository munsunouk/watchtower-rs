name: Bifrost Chainlink USDC Balance Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();

  BalanceUSDC = Bifrost.Balance(bifrostBN, USDC);

  CompareBalance = 10000000000000000000;

  msg = '*Bifrost Chainlink USDC Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceUSDC + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceUSDC (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
