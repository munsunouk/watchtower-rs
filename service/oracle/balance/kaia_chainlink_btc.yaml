name: Kaia Chainlink BTC Balance Check
time_interval: 300
script: |
  kaiaBN = Kaia.LatestBlock();

  BalanceBTC = Kaia.Balance(kaiaBN, BTC);

  CompareBalance = 10000000000000000000;

  msg = '*Kaia Chainlink BTC Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceBTC + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceBTC (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
