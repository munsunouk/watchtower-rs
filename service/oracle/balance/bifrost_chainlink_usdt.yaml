name: Bifrost Chainlink USDT Balance Check
time_interval: 300
script: |
  decimal = 10 ** 18;
  notify_time_interval = 60 * 60 * 3;
  bifrostBN = Bifrost.LatestBlock();

  BalanceUSDT = Bifrost.Balance(bifrostBN, USDT) / decimal;

  CompareBalance = 10;

  msg = '*Bifrost Chainlink USDT Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceUSDT + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceUSDT (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
