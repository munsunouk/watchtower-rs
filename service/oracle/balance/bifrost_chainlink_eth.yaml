name: Bifrost Chainlink ETH Balance Check
time_interval: 300
script: |
  bifrostBN = Bifrost.LatestBlock();

  BalanceETH = Bifrost.Balance(bifrostBN, ETH);

  CompareBalance = 10000000000000000000;

  msg = '*Bifrost Chainlink ETH Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceETH + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceETH (
    Slack.Send(Monitor, notify_time_interval, msg)
  );
