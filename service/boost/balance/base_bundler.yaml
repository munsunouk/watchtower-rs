name: Base Bundler Native Balance Check
time_interval: 300
script: |
  notify_time_interval = 60 * 60 * 3;
  decimal = 10 ** 18;
  baseBN = Base.LatestBlock();

  BalanceBundler = Base.Balance(baseBN, Bundler) / decimal;

  CompareBalance = 0.02;

  msg = '*Base Bundler Native Balance 알람* 🚀\n> 현재 잔액 : ' + BalanceBundler + '\n> 기준 잔액 : ' + CompareBalance;

  if CompareBalance > BalanceBundler (
    Slack.Send(Monitor, notify_time_interval, msg);
  );
