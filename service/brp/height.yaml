name: BRP Height Check
time_interval: 600
script: |
  number_diff = 3;
  mempool_height = BRP.ApiHeight(MemPool);
  atn_height = BRP.BTCHeight(ATN);

  height_diff = when mempool_height > atn_height then mempool_height - atn_height else 0;
  when height_diff > number_diff then Slack.Send(CORE, '*BRP BTC Block 알람* 🚀\n <!here>\n> 블록 차이: ' + height_diff + '\n> 멤풀(mempool.space) : ' + mempool_height + '\n> ATN노드 : ' + atn_height) else false;
  when height_diff > number_diff then Slack.Send(BTCFI, '*BRP BTC Block 알람* 🚀\n <!here>\n> 블록 차이: ' + height_diff + '\n> 멤풀(mempool.space) : ' + mempool_height + '\n> ATN노드 : ' + atn_height) else false;
