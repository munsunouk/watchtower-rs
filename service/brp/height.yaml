name: BRP Height Check
time_interval: 600
script: |
  number_diff = 3;
  mempool_height = BRP.ApiHeight(MemPool);
  atn_height = BRP.BTCHeight(ATN);

  height_diff = when mempool_height > atn_height then mempool_height - atn_height else atn_height - mempool_height;
  when height_diff > number_diff then Slack.Send(CORE, 'the Difference in the Block Height of BTC is more than ' + number_diff) else false;
