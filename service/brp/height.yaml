name: BRP Height Check
time_interval: 600
script: |
  notifiy_number_diff = 3;
  notify_time_interval = 60 * 60 * 3;

  mempool_height = BRP.ApiHeight(MemPool);
  atn_height = BRP.BTCHeight(ATN);

  height_diff = mempool_height - atn_height;

  msg = '*BRP BTC Block 알람* 🚀\n <!here>\n> 블록 차이: ' + height_diff + '\n> 멤풀(mempool.space) : ' + mempool_height + '\n> ATN노드 : ' + atn_height;

  if height_diff > notifiy_number_diff (
    Slack.Send(CORE, notify_time_interval, msg);
  );
